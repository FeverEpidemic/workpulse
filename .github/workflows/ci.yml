name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main or tag run halfway through publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  # Playwright is always run through @playwright/test's own CLI: a top-level `playwright`
  # package at another version breaks every spec (see docs/verification/ci-github-actions.md).
  PW_CLI: node node_modules/@playwright/test/cli.js

jobs:
  # Docs-only changes skip the heavy jobs. They are skipped, not left out, so required
  # checks still report and the PR can merge. Tags and manual runs always run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
      release_docs: ${{ steps.filter.outputs.release_docs }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        with:
          predicate-quantifier: every
          # tests/unit/release-docs.test.ts reads the T25 runbook and checklist.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            release_docs:
              - 'docs/verification/T25-release-*.md'

  checks:
    name: Lint, typecheck, unit, build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.release_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: |
          $PW_CLI install --with-deps chromium
          # Vitest browser mode (Storybook project) resolves its own playwright package.
          if [ -f node_modules/playwright/cli.js ]; then
            node node_modules/playwright/cli.js install chromium
          fi

      - run: pnpm test

      - run: pnpm worker:check

      - run: pnpm build

  database:
    name: Supabase, integration, smoke E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The npm `supabase` package has no allow-listed build script, so its binary is never
      # downloaded. Use the official CLI action pinned to the devDependency version and call
      # `supabase` directly instead of the pnpm db:* scripts.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Export local Supabase env
        run: |
          supabase status -o env | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          for name in $(cut -d= -f1 "$RUNNER_TEMP/supabase.env" | grep -E 'KEY|SECRET'); do
            echo "::add-mask::${!name}"
          done
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY" && test -n "$SECRET_KEY" && test -n "$DB_URL"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
            # Same value as .env.example; routes and tests derive the trusted Origin from it.
            echo "WORKPULSE_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase.env"

      - name: Schema lint
        run: supabase db lint --level error

      - name: pgTAP
        run: supabase test db

      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u --strip-trailing-cr src/server/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"

      # Only suites that need nothing beyond Supabase. Evidence, import, CV export, AI jobs
      # and the M3/M4 journeys also need ClamAV or Gotenberg and are not run here.
      # account-deletion goes first: its workers claim one cleanup job per pass, so storage
      # jobs left by earlier suites keep the receipt from completing within its round cap.
      - name: Integration (Supabase only)
        run: |
          pnpm test:integration:account-deletion
          pnpm test:integration:activity
          pnpm test:integration:projects
          pnpm test:integration:achievements
          pnpm test:integration:dashboard
          pnpm test:integration:m2
          pnpm test:integration:cv
          pnpm test:integration:cv-builder
          pnpm test:integration:cv-freshness
          pnpm test:integration:ai-review
          pnpm test:integration:product-events
          pnpm test:integration:release

      # Counts and error codes only: no ids, keys or user content.
      - name: Queue state after integration failure
        if: failure()
        run: |
          docker exec supabase_db_WorkPulse psql -U postgres -d postgres -X -c \
            "select status, count(*) from internal.account_deletions group by 1 order by 1;" -c \
            "select split_part(object_key, '/', 2) as area, status, error_code, count(*), bool_or(next_attempt_at > now()) as deferred from internal.storage_jobs group by 1, 2, 3 order by 1, 2;" -c \
            "select count(*) as objects_left from storage.objects where bucket_id = 'workpulse-private';"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: $PW_CLI install --with-deps chromium

      - name: Smoke E2E
        run: $PW_CLI test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # CD: build and test both images on every run; publish to GHCR only for a push to main
  # or a v* tag, after checks and database have passed. Deploying them is a later step.
  images:
    name: Image ${{ matrix.target }}
    needs: [checks, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    env:
      IMAGE: ghcr.io/feverepidemic/workpulse-${{ matrix.target }}
      LOCAL_TAG: workpulse-${{ matrix.target }}:test
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: No env files in the image
        run: |
          found=$(docker run --rm --entrypoint sh "$LOCAL_TAG" -c "find /app -name '.env*' -not -path '*/node_modules/*'")
          if [ -n "$found" ]; then echo "$found"; exit 1; fi

      - name: Web serves /api/health
        if: matrix.target == 'web'
        run: |
          docker run -d --name web -p 3000:3000 "$LOCAL_TAG"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health -o "$RUNNER_TEMP/health.json" && break
            sleep 1
          done
          node -e 'const b = require(process.argv[1]); if (b.status !== "ok" || b.service !== "workpulse-web") process.exit(1)' "$RUNNER_TEMP/health.json"
          if curl -sSI http://127.0.0.1:3000/api/health | grep -qi '^x-powered-by'; then exit 1; fi

      - name: Web container log
        if: always() && matrix.target == 'web'
        run: docker logs web 2>&1 | tail -n 50; docker rm -f web || true

      - name: Worker loads every module and fails closed without config
        if: matrix.target == 'worker'
        run: |
          docker run --rm "$LOCAL_TAG" node workers/check.ts
          set +e
          err=$(docker run --rm "$LOCAL_TAG" node workers/run.ts --once 2>&1 >/dev/null)
          code=$?
          set -e
          echo "$err"
          [ "$code" = 1 ]
          echo "$err" | grep -qx 'WORKER_UNAVAILABLE'
          if echo "$err" | grep -q 'ERR_'; then exit 1; fi

      - name: Image tags
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
