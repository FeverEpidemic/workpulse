# pnpm settings for this single-package project (pnpm 11 reads settings here).
# No `packages` key on purpose: WorkPulse is one Next.js package at the repository
# root, not a monorepo. Native build scripts are allow-listed explicitly.
allowBuilds:
  unrs-resolver: true
# T15: pdfjs-dist lists @napi-rs/canvas as optional (rendering only). Import parsing is
# text extraction in an isolated thread and must stay pure JavaScript, so the native
# canvas binary is never installed.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
